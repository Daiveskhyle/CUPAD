name: Fix mobile savings display source

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch combined savings display query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/v1/combined.php')
          text = p.read_text()
          old = '''    $s=$pdo->prepare("SELECT client_id,balance FROM saving_balances WHERE client_id IN ($ph)"); $s->execute($ids); while($r=$s->fetch(PDO::FETCH_ASSOC))$balances[$r['client_id']]=(float)$r['balance'];'''
          new = '''    // Savings screen must read the same primary balance source as co/saving_collection.php.
    // Prefer savings.balance; only fall back to saving_balances when no active savings account exists.
    $s=$pdo->prepare("SELECT c.id AS client_id, COALESCE((SELECT balance FROM savings WHERE client_id=c.id AND status='active' ORDER BY created_at ASC LIMIT 1),(SELECT balance FROM saving_balances WHERE client_id=c.id LIMIT 1),0) AS balance FROM clients c WHERE c.id IN ($ph)"); $s->execute($ids); while($r=$s->fetch(PDO::FETCH_ASSOC))$balances[$r['client_id']]=(float)$r['balance'];'''
          if old not in text:
              raise SystemExit('Expected savings display query was not found; refusing to modify the wrong code.')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/v1/combined.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile savings display balance source"
          git push