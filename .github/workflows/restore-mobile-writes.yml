name: Restore Mobile Writes
on:
  push:
    paths:
      - '.github/workflows/restore-mobile-writes.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore file
        run: |
          git checkout c3595b98d7ccaf93b3dab4f30a6d0c6b066360ce -- api/v1/mobile-writes.php
          rm -f .github/workflows/restore-mobile-writes.yml .github/workflows/restore-mobile-savings-fix.yml
      - name: Commit restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/v1/mobile-writes.php .github/workflows/restore-mobile-writes.yml .github/workflows/restore-mobile-savings-fix.yml
          git diff --cached --quiet || git commit -m 'restore: mobile writes routes'
          git push
